# Step 2 — HTTPS reverse proxy to the Node container (after certbot created the certificate).
# install:  sudo cp deploy/nginx-10-https.conf /etc/nginx/conf.d/asveli-https.conf && sudo nginx -t && sudo systemctl reload nginx
limit_req_zone $binary_remote_addr zone=asveli_api:10m rate=10r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.asveli.com;

    ssl_certificate     /etc/letsencrypt/live/api.asveli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.asveli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 2g;               # keep >= MAX_UPLOAD_MB
    client_header_timeout 20s;

    # The app sets HSTS/CSP/etc. itself. nginx only needs to pass real client IP and protocol.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;      # OVERWRITE (not append) so clients can't spoof their IP
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_request_buffering off;           # stream big uploads straight to Google Drive, no temp files on this server
    proxy_buffering         off;           # stream downloads / video Range responses
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    location ~ /\. { deny all; }

    # The admin panel is NOT served through this server. It lives on a separate loopback-only listener and is
    # opened through an SSH tunnel. Answer 404 here as a second line of defence, in case someone ever points a
    # proxy_pass at the wrong place. (The public app has no admin routes either.)
    location ~* ^/(admin|api/admin)(/|$) {
        return 404;
    }

    location / {
        limit_req zone=asveli_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
}
