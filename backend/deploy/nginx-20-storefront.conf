# Static storefront (Vite build, storefront/dist) for the shop domain. The API stays on api.asveli.com (nginx-10-https.conf).
# Build:  cd storefront && VITE_API_URL=https://api.asveli.com npm ci && npm run build
# Copy:   sudo mkdir -p /var/www/asveli && sudo rsync -a --delete dist/ /var/www/asveli/
# Cert:   sudo certbot certonly --webroot -w /var/www/certbot -d asveli.com -d www.asveli.com
# Remember: add the shop domain to STORE_ORIGINS in the backend .env.
server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name asveli.com www.asveli.com;
    ssl_certificate     /etc/letsencrypt/live/asveli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asveli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /var/www/asveli; index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # fonts are self-hosted; images may come from the API (/f/…) or https sellers' URLs; XHR only to the API
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.asveli.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ /\. { deny all; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
server { listen 80; listen [::]:80; server_name asveli.com www.asveli.com; location /.well-known/acme-challenge/ { root /var/www/certbot; } location / { return 301 https://$host$request_uri; } }
