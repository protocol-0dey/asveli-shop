# Step 1 — plain HTTP only, used to obtain the certificate and to redirect everything else to HTTPS.
# install:  sudo cp deploy/nginx-00-http.conf /etc/nginx/conf.d/asveli-http.conf && sudo mkdir -p /var/www/certbot && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name api.asveli.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
